[project]
name = "oncall-investigator"
version = "0.1.0"
description = "An AI agent that investigates production alerts and reports the root cause, with a benchmark that measures how often it is right."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
]

[tool.ruff.lint]
# Added on top of ruff's default rules
extend-select = [
    "E",  # pycodestyle: style errors such as comparing to None with ==
    "B",  # flake8-bugbear: patterns that are usually bugs
]
# Line length is the formatter's job
ignore = ["E501"]

[tool.uv.workspace]
# Each member is a Python project with its own pyproject.toml; all share uv.lock
members = ["services/gateway"]
