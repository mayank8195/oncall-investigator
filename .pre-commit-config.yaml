repos:
  # Secret scan: blocks a commit that contains an API key, token or password
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      # Work goes on a branch and reaches main through a pull request
      - id: no-commit-to-branch
        args: [--branch, main]

  # Python: lint, then format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Python unit tests: fast, and need nothing running
  - repo: local
    hooks:
      - id: pytest
        name: python tests
        entry: make test-python
        language: system
        files: ^services/.*\.py$
        pass_filenames: false
