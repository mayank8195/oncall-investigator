# Checks that run on GitHub for every pull request and every push to main.
# They need no secrets.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# The jobs may read the repository and nothing else
permissions:
  contents: read

# A new push to the same branch cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.24"
      - name: Install packages exactly as locked
        run: uv sync --all-packages --frozen
      - name: Lint
        run: |
          uvx ruff@0.16.10 check .
          uvx ruff@0.16.10 format --check .
      - name: Test
        run: make test-python

  java:
    name: Java tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        run: make test-java

  images:
    name: Build images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build every image, without publishing
        run: docker compose -f compose/compose.yaml build
